name: Bug report
description: Report a Nexora Manager bug or regression.
title: 'bug: '
labels: ['Bug report']
body:
  - type: markdown
    attributes:
      value: |
        # Nexora Manager bug report

        Before submitting, search existing issues and make sure the problem is reproducible.
        Please include enough information for the issue to be investigated.
  - type: textarea
    attributes:
      label: Bug description
      description: Describe what happened, what you expected, and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Patch logs
      description: Export the patcher logs after the patching process finishes, when applicable.
      render: shell
  - type: textarea
    attributes:
      label: Debug logs
      description: Export debug logs from Settings > Advanced when possible.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Acknowledgements
      options:
        - label: I checked open and closed issues and this is not a duplicate.
          required: true
        - label: I used an appropriate and descriptive title.
          required: true
        - label: I provided the requested logs and reproduction information where available.
          required: true
        - label: The issue is related to Nexora Manager.
          required: true
