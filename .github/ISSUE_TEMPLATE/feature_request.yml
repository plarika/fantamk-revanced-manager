name: Feature request
description: Suggest an improvement for Nexora Manager.
title: 'feat: '
labels: ['Feature request']
body:
  - type: markdown
    attributes:
      value: |
        # Nexora Manager feature request

        Search existing issues first and describe the problem the feature would solve.
        Requests should be specific enough to evaluate and test.
  - type: textarea
    attributes:
      label: Feature description
      description: Describe the proposed feature and how it should behave.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation and use case
      description: Explain why the feature is useful, who benefits, and the concrete use case.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, references, or implementation considerations when useful.
  - type: checkboxes
    attributes:
      label: Acknowledgements
      options:
        - label: I checked open and closed feature requests and this is not a duplicate.
          required: true
        - label: The request is specifically about Nexora Manager.
          required: true
        - label: I described a concrete use case rather than only a preferred implementation.
          required: true
